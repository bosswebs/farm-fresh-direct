name: Keep Supabase Storage project active

on:
  schedule:
    # Every 3 days — comfortably inside Supabase's 7-day free-tier inactivity window.
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the Storage API to register activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secret." >&2
            exit 1
          fi

          # Fetching a real, permanent object is unambiguous: 200 means the
          # project (and this bucket) are genuinely reachable and serving traffic.
          status=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "$SUPABASE_URL/storage/v1/object/public/product-images/_healthcheck.txt" \
            -H "apikey: $SUPABASE_ANON_KEY")

          echo "Storage API responded: $status"
          cat /tmp/resp.txt
          echo ""

          if [ "$status" != "200" ]; then
            echo "Supabase project did not respond as expected — it may be paused." >&2
            exit 1
          fi
