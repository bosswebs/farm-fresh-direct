name: Keep Supabase Storage project active

on:
  schedule:
    # Every 3 days — comfortably inside Supabase's 7-day free-tier inactivity window.
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the Storage API to register activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secret." >&2
            exit 1
          fi

          status=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            "$SUPABASE_URL/storage/v1/bucket/product-images" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Storage API responded: $status"
          cat /tmp/resp.json
          echo ""

          # 200 = bucket found, 404 = bucket missing but project is awake either way.
          if [ "$status" != "200" ] && [ "$status" != "404" ]; then
            echo "Unexpected status from Supabase — project may be paused or misconfigured." >&2
            exit 1
          fi
